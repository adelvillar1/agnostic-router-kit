# One job: npm test. That is deliberately the whole CI.
#
# The suite is zero-model-call and zero-real-network by design: every probe
# spawns a scratch router on its own AGNOSTIC_ROUTER_KIT_HOME, talks to
# 127.0.0.1 only (the providers are tools/fake-upstream.mjs instances), and
# leaves no state behind. tools/guard.sh and tools/compare-journals.py need
# the sibling edition's checkout and stay local-only.
#
# Deliberately NOT copied from bigger projects: merge queues, multi-OS
# sharding, duration-sequenced shards. One green job is the gate.
#
# Node 24, not 20: the probes import .mts modules, and Node only strips
# TypeScript types from 22.6 (flagged) / 23.6 (unflagged) — every probe
# touching a .mts failed ERR_UNKNOWN_FILE_EXTENSION on the Node 20 runner
# while passing locally (KI-001, the 2026-10-14 runs).
# npm install before npm test: workflow-plane is a `file: lib/workflow`
# dependency, so without an install step the probes that import it died
# ERR_MODULE_NOT_FOUND on the runner (the same KI-001 runs). Plain
# `npm install`, not `npm ci`: the lockfile is deliberately gitignored
# here (a file:-dependency lock pins a machine path), so there is
# nothing for ci to be strict about.
# npm install --prefix router before npm test: `kit apply` renders the
# runtime by copying router/node_modules/@typesafe-ai from this checkout,
# and that directory is gitignored like every node_modules — so a fresh
# clone's scratch routers died "Cannot find package '@typesafe-ai/sdk'"
# (five suites on the same KI-001 runs). Reproduced and restored locally:
# without the directory 33 suites / 5 fail, `npm install --prefix router`
# and 33 suites / 0 fail.
name: ci

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm install --prefix router
      - run: npm test
