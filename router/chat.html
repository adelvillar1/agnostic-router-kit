<!doctype html>
<!--
  agnostic-router chat — the router's conversational surface, served at /chat.

  Two things live here, on purpose, in one screen. On the left, a chat with
  the router itself: every message is judged and routed like any client's
  (model "auto", streaming, the verdict in the response headers). On the
  right, the agent control plane: every connected harness — a coding agent,
  a script, anything holding an app token — with its live runs, and an answer
  box on any run that is waiting for a human.

  Self-contained on purpose, like the dashboard: no CDN, no build step, no
  framework, no webfonts — the design leans on the platform's own families
  (serif for the greeting voice, system sans for prose, mono for data).
  The shell carries no secrets (the server stamps the local token at serve
  time); every call rides the same Bearer gate the proxy routes use.

  ?demo=1 renders a fully synthetic conversation, agents and escalation — a
  visual-verification fixture, clearly badged DEMO, that touches no endpoint.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>auto-router · chat</title>
<script>
  try {
    const t = localStorage.getItem("agnostic-router-theme");
    document.documentElement.dataset.theme =
      t === "light" || t === "dark" ? t
      : matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
  } catch {}
</script>
<style>
  /* ── the instrument palette — shared shape with setup.html ─────────────── */
  :root {
    color-scheme: dark;
    --bg: #0a0c10; --bg-raise: #0d1016;
    --panel: #10141b; --panel2: #151a23;
    --line: #1d2330; --line-bright: #2b3444;
    --text: #e8edf4; --dim: #97a3b6; --faint: #5f6b7d;
    --accent: #4dc4ff; --accent-dim: #2b6f9c; --accent-ink: #06121b;
    --amber: #ffb454; --ok: #3fd68f; --err: #ff7070;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --serif: ui-serif, "New York", Georgia, "Times New Roman", serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f7f8fa; --bg-raise: #ffffff;
    --panel: #ffffff; --panel2: #f2f4f8;
    --line: #e4e8ef; --line-bright: #ccd3de;
    --text: #17222e; --dim: #5b6a7d; --faint: #8b98a8;
    --accent: #0071c7; --accent-dim: #8fc4e8; --accent-ink: #ffffff;
    --amber: #9a5d00; --ok: #14804d; --err: #c03e3e;
  }
  * { box-sizing: border-box; }
  .hidden { display: none !important; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.6 var(--sans);
    display: flex; flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }
  code, .mono, kbd { font-family: var(--mono); }
  ::selection { background: color-mix(in srgb, var(--accent) 30%, transparent); }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: var(--line-bright); border-radius: 5px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-track { background: transparent; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  /* ── header ────────────────────────────────────────────────────────────── */
  header {
    display: flex; align-items: center; gap: 12px;
    height: 50px; padding: 0 16px;
    border-bottom: 1px solid var(--line);
    background: color-mix(in srgb, var(--panel) 88%, transparent);
    backdrop-filter: blur(6px);
    z-index: 5;
  }
  .mark {
    width: 20px; height: 20px; border-radius: 50%;
    border: 1.5px solid var(--accent);
    display: inline-flex; align-items: center; justify-content: center;
    box-shadow: 0 0 10px color-mix(in srgb, var(--accent) 35%, transparent);
  }
  .mark i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  header h1 { font-size: 13.5px; margin: 0; font-weight: 650; letter-spacing: .01em; }
  header h1 span { color: var(--faint); font-weight: 450; }
  .chip {
    font: 11px var(--mono); letter-spacing: .04em;
    color: var(--dim); padding: 3px 10px;
    border: 1px solid var(--line); border-radius: 20px;
    white-space: nowrap;
  }
  .chip.accent { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
  .chip.demo { color: var(--amber); border-color: color-mix(in srgb, var(--amber) 50%, transparent); }
  header .spacer { flex: 1; }
  header a.nav, button.theme {
    appearance: none; background: none; cursor: pointer;
    color: var(--dim); font: 500 12px var(--sans); text-decoration: none;
    border: 1px solid var(--line); border-radius: 20px; padding: 4px 12px;
    transition: color .15s, border-color .15s;
  }
  header a.nav:hover, button.theme:hover { color: var(--text); border-color: var(--accent-dim); }

  /* ── frame ─────────────────────────────────────────────────────────────── */
  main { flex: 1; display: grid; grid-template-columns: 1fr 328px; min-height: 0; }
  @media (max-width: 940px) { main { grid-template-columns: 1fr; } #rail { display: none; } }

  /* ── chat column ───────────────────────────────────────────────────────── */
  #chatPane { display: flex; flex-direction: column; min-height: 0; }
  #thread { flex: 1; overflow-y: auto; padding: 28px 24px 16px; }
  #col { max-width: 760px; margin: 0 auto; }

  .welcome { max-width: 620px; margin: 7vh auto 0; animation: rise .3s ease-out; }
  .welcome h2 {
    font: 500 30px/1.15 var(--serif); letter-spacing: -.01em;
    margin: 0 0 10px;
  }
  .welcome .lead { color: var(--dim); font-size: 14.5px; margin: 0 0 30px; max-width: 46ch; }
  .welcome .lead b { color: var(--text); font-weight: 600; }
  .ex { display: grid; gap: 8px; }
  .ex button {
    appearance: none; text-align: left; cursor: pointer;
    display: flex; align-items: baseline; gap: 12px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 16px; font: inherit; color: var(--dim);
    transition: border-color .15s, transform .15s, background .15s;
    animation: rise .3s ease-out backwards;
  }
  .ex button:nth-child(2) { animation-delay: .05s; }
  .ex button:nth-child(3) { animation-delay: .1s; }
  .ex button:hover { border-color: var(--accent-dim); color: var(--text); transform: translateY(-1px); }
  .ex .g { color: var(--accent); font: 12px var(--mono); }
  .ex b { color: var(--text); font-weight: 600; font-size: 13.5px; }
  .ex .d { font-size: 12.5px; }
  .hintline { margin-top: 22px; color: var(--faint); font: 11.5px var(--mono); }
  .hintline kbd {
    font: 10.5px var(--mono); color: var(--dim);
    border: 1px solid var(--line-bright); border-bottom-width: 2px;
    border-radius: 4px; padding: 1px 5px;
  }

  /* messages */
  .m { margin: 0 0 20px; animation: rise .22s ease-out; }
  .m-user { display: flex; justify-content: flex-end; }
  .m-user .bubble {
    max-width: 72%; background: var(--panel2);
    border: 1px solid var(--line); border-radius: 14px 14px 4px 14px;
    padding: 9px 14px; white-space: pre-wrap; word-wrap: break-word;
  }
  .m-bot .who {
    font: 600 10.5px var(--mono); letter-spacing: .1em; text-transform: uppercase;
    color: var(--faint); margin-bottom: 6px; display: flex; align-items: center; gap: 7px;
  }
  .m-bot .who::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px color-mix(in srgb, var(--accent) 60%, transparent); }
  .m-bot .body { word-wrap: break-word; }
  .m-bot .body p { margin: 0 0 10px; }
  .m-bot .body p:last-child { margin-bottom: 0; }
  .m-bot .body h1, .m-bot .body h2, .m-bot .body h3 { font: 600 15px/1.4 var(--sans); margin: 14px 0 6px; }
  .m-bot .body ul, .m-bot .body ol { margin: 0 0 10px; padding-left: 22px; }
  .m-bot .body li { margin: 3px 0; }
  .m-bot .body blockquote { margin: 0 0 10px; padding: 2px 14px; border-left: 2px solid var(--accent-dim); color: var(--dim); }
  .m-bot .body code { font: 12px var(--mono); background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }
  .m-bot .body a { color: var(--accent); }
  .m-bot .body hr { border: none; border-top: 1px solid var(--line); margin: 12px 0; }
  .codeblock { margin: 10px 0; border: 1px solid var(--line); border-radius: 9px; background: var(--bg-raise); overflow: hidden; }
  .codeblock .cbhead {
    display: flex; align-items: center; justify-content: space-between;
    padding: 5px 12px; border-bottom: 1px solid var(--line);
    font: 10.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--faint);
  }
  .codeblock .cbcopy { appearance: none; background: none; border: none; color: var(--faint); font: 10.5px var(--mono); cursor: pointer; padding: 0; }
  .codeblock .cbcopy:hover { color: var(--accent); }
  .codeblock pre { margin: 0; padding: 11px 14px; overflow-x: auto; font: 12px/1.55 var(--mono); }
  .m-bot.err .body { color: var(--err); }
  .caret { display: inline-block; width: 8px; height: 15px; margin-left: 1px; background: var(--accent); vertical-align: -2px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes rise { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }

  .verdict {
    display: flex; align-items: center; gap: 8px;
    margin-top: 9px; padding-top: 8px; border-top: 1px solid var(--line);
    font: 10.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--faint);
  }
  .verdict .tick { width: 14px; height: 2px; background: var(--accent); border-radius: 1px; flex-shrink: 0; }
  .verdict b { color: var(--dim); font-weight: 600; }

  /* run cards in the thread */
  .runcard { margin: 0 0 20px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); overflow: hidden; animation: rise .22s ease-out; }
  .runcard .rhead {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px;
    border-bottom: 1px solid var(--line);
    font: 600 12px var(--sans);
  }
  .runcard .rid { font: 11px var(--mono); color: var(--faint); font-weight: 400; }
  .runcard .rwho { margin-left: auto; font: 10.5px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--faint); }
  .runcard .revs { max-height: 216px; overflow-y: auto; padding: 8px 16px; font: 11.5px/1.7 var(--mono); color: var(--dim); }
  .runcard .revs div { white-space: pre-wrap; }
  .runcard .rstat { padding: 7px 14px; border-top: 1px solid var(--line); font: 10.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--faint); display: flex; gap: 8px; align-items: center; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); animation: pulse 1.3s ease-in-out infinite; flex-shrink: 0; }
  .dot.ok { background: var(--ok); animation: none; }
  .dot.bad { background: var(--err); animation: none; }
  @keyframes pulse { 50% { opacity: .3; } }
  .k-esca, .g-esca { color: var(--amber); }
  .k-run-, .g-done { color: var(--ok); }
  .k-run-f, .g-fail { color: var(--err); }

  /* composer */
  #composer { padding: 14px 24px 18px; }
  #cwrap { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; }
  #say {
    flex: 1; background: var(--panel); color: var(--text);
    border: 1px solid var(--line-bright); border-radius: 12px;
    padding: 11px 16px; font: inherit; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  #say::placeholder { color: var(--faint); }
  #say:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
  #send {
    appearance: none; border: none; cursor: pointer;
    background: var(--accent); color: var(--accent-ink);
    font: 600 13px var(--sans); border-radius: 12px; padding: 0 22px;
    transition: filter .15s, transform .1s;
  }
  #send:hover { filter: brightness(1.08); }
  #send:active { transform: translateY(1px); }
  #send:disabled { opacity: .45; cursor: default; }

  /* ── agents rail ───────────────────────────────────────────────────────── */
  #rail { border-left: 1px solid var(--line); background: var(--bg-raise); overflow-y: auto; padding: 18px 16px 24px; }
  .rlabel {
    display: flex; align-items: center; gap: 8px;
    font: 600 10.5px var(--mono); letter-spacing: .14em; text-transform: uppercase;
    color: var(--faint); margin: 0 0 10px;
  }
  .rlabel .n { color: var(--accent); }
  .rlabel::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  .atten {
    border: 1px solid color-mix(in srgb, var(--amber) 45%, transparent);
    border-left-width: 2px; border-radius: 10px;
    background: color-mix(in srgb, var(--amber) 7%, var(--panel));
    padding: 12px 14px; margin-bottom: 16px;
    animation: rise .25s ease-out;
  }
  .atten .who { font: 600 10px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--amber); margin-bottom: 6px; }
  .atten .q { font-size: 13px; line-height: 1.5; margin-bottom: 4px; }
  .atten .ev { color: var(--faint); font: 11px/1.5 var(--mono); margin-bottom: 10px; word-break: break-word; }
  .atten input {
    width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid var(--line-bright); border-radius: 8px;
    padding: 7px 10px; font: 12.5px var(--sans); outline: none; margin-bottom: 8px;
  }
  .atten input:focus { border-color: var(--amber); }
  .atten .row { display: flex; gap: 8px; }
  .atten button {
    appearance: none; border-radius: 8px; padding: 6px 14px; cursor: pointer;
    font: 600 12px var(--sans); border: 1px solid var(--line-bright);
    background: var(--panel2); color: var(--text);
    transition: filter .15s;
  }
  .atten button.primary { background: var(--ok); border-color: var(--ok); color: #06130c; }
  .atten button:hover { filter: brightness(1.12); }
  .atten .answered { color: var(--ok); font: 12px var(--sans); }

  .agent { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); margin-bottom: 8px; overflow: hidden; }
  .ahead { display: flex; align-items: center; gap: 9px; padding: 9px 12px; cursor: pointer; transition: background .15s; }
  .ahead:hover { background: color-mix(in srgb, var(--accent) 5%, transparent); }
  .adot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .adot.live { box-shadow: 0 0 7px currentColor; animation: pulse 1.6s ease-in-out infinite; }
  .aname { font-weight: 650; font-size: 12.5px; }
  .ameta { margin-left: auto; font: 10px var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--faint); text-align: right; }
  .aruns { border-top: 1px solid var(--line); padding: 4px 12px 8px; }
  .arun { padding: 6px 0; cursor: pointer; }
  .arun .awf { font: 600 12px var(--sans); display: flex; align-items: center; gap: 7px; }
  .arun .ast { color: var(--faint); font: 10.5px var(--mono); margin: 1px 0 0 15px; }
  .arun .awf .st { font: 9.5px var(--mono); letter-spacing: .08em; color: var(--amber); }
  .arun .aevs {
    display: none; margin: 6px 0 2px 15px; padding-left: 10px;
    border-left: 1px solid var(--line-bright);
    font: 11px/1.7 var(--mono); color: var(--dim);
    max-height: 150px; overflow-y: auto;
  }
  .arun.open .aevs { display: block; }
  .empty { color: var(--faint); font-size: 12px; padding: 2px 2px 10px; }

  /* ── token gate ────────────────────────────────────────────────────────── */
  #gate { position: fixed; inset: 0; background: color-mix(in srgb, var(--bg) 72%, transparent); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 50; }
  #gate .box { background: var(--panel); border: 1px solid var(--line-bright); border-radius: 14px; padding: 26px; width: 380px; box-shadow: 0 18px 50px rgba(0,0,0,.4); }
  #gate h2 { font: 500 19px var(--serif); margin: 0 0 8px; }
  #gate p { color: var(--dim); font-size: 12.5px; margin: 0 0 14px; }
  #gate input { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line-bright); border-radius: 9px; padding: 8px 11px; font: 13px var(--mono); outline: none; }
  #gate input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
  #gate .err { color: var(--err); font-size: 12px; margin-top: 8px; min-height: 16px; }
  #gate button { width: 100%; margin-top: 8px; appearance: none; border: none; cursor: pointer; background: var(--accent); color: var(--accent-ink); font: 600 13px var(--sans); border-radius: 9px; padding: 9px; }
</style>
</head>
<body>

<header>
  <span class="mark"><i></i></span>
  <h1>auto-router <span>· chat</span></h1>
  <span class="chip accent" id="routePill">model auto</span>
  <span class="chip demo hidden" id="demoPill">demo</span>
  <span class="spacer"></span>
  <a class="nav" href="/setup">Setup</a>
  <a class="nav" href="/dashboard">Dashboard</a>
  <button class="theme" id="themeBtn" title="switch theme">◐</button>
</header>

<main>
  <div id="chatPane">
    <div id="thread"><div id="col"></div></div>
    <div id="composer">
      <div id="cwrap">
        <input id="say" type="text" placeholder='Say anything — or /run <workflow> to start one' autocomplete="off" spellcheck="false">
        <button id="send">Send</button>
      </div>
    </div>
  </div>

  <div id="rail">
    <p class="rlabel">agents <span class="n" id="agentCount"></span></p>
    <div id="attention"></div>
    <p class="rlabel" style="margin-top:16px">runs</p>
    <div id="agents"><div class="empty">reading the journals…</div></div>
  </div>
</main>

<div id="gate" class="hidden">
  <div class="box">
    <h2>The router's token</h2>
    <p>Chat and the agent rail go through the same token any client uses — <span class="mono">router.config.json → localToken</span>. It stays in this browser.</p>
    <input type="password" id="gateToken" placeholder="local token" autocomplete="off">
    <div class="err" id="gateErr"></div>
    <button id="gateGo">Unlock</button>
  </div>
</div>

<script>
"use strict";
const $ = (s, el) => (el ?? document).querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const TOKEN_KEY = "agnostic-router-token";
// Stamped by the server at serve time; wins over stale localStorage so a
// wrong saved value self-heals on reload. Same trade as the dashboard's.
const INJECTED_TOKEN = "";
let token = INJECTED_TOKEN || localStorage.getItem(TOKEN_KEY) || "";
const DEMO = new URLSearchParams(location.search).has("demo");

const THEME_KEY = "agnostic-router-theme";
$("#themeBtn").onclick = () => {
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem(THEME_KEY, next); } catch {}
};

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}`, ...(opts.headers ?? {}) },
  });
  if (res.status === 401) {
    if (token) showGate("That token was rejected.");
    throw new Error("unauthorized");
  }
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(body.error ?? `HTTP ${res.status}`), { body });
  return body;
}

function showGate(msg) {
  $("#gateErr").textContent = msg ?? "";
  $("#gate").classList.remove("hidden");
  $("#gateToken").focus();
}
$("#gateGo").onclick = async () => {
  token = $("#gateToken").value.trim();
  try {
    await api("/api/state");
    localStorage.setItem(TOKEN_KEY, token);
    $("#gate").classList.add("hidden");
    boot();
  } catch (e) { if (e.message !== "unauthorized") $("#gateErr").textContent = e.message; }
};
$("#gateToken").addEventListener("keydown", (e) => { if (e.key === "Enter") $("#gateGo").click(); });

/* ── markdown, escape-first ─────────────────────────────────────────────
   The model's reply is untrusted text: everything is escaped before any
   tag is added, and the only tags that ever appear are the ones this
   function writes itself. Fenced code is lifted out first and re-attached
   as real <pre> blocks with a copy button. */
function renderMarkdown(src) {
  const blocks = [];
  let text = String(src ?? "").replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => {
    blocks.push({ lang: lang || "code", code: code.replace(/\n$/, "") });
    return `\u0000${blocks.length - 1}\u0000`;
  });
  const inline = (s) => s
    .replace(/`([^`\n]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<i>$2</i>")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  const lines = esc(text).split("\n");
  let html = "", list = null, para = [];
  const flushPara = () => { if (para.length) { html += `<p>${inline(para.join("<br>"))}</p>`; para = []; } };
  const flushList = () => { if (list) { html += `<${list.tag}>${list.items.map((i) => `<li>${inline(i)}</li>`).join("")}</${list.tag}>`; list = null; } };
  for (const line of lines) {
    const t = line.trim();
    const bm = /^\u0000(\d+)\u0000$/.exec(t);
    if (bm) { flushPara(); flushList(); html += bm[0]; continue; }
    if (!t) { flushPara(); flushList(); continue; }
    const h = /^(#{1,3})\s+(.*)$/.exec(t);
    if (h) { flushPara(); flushList(); html += `<h${h[1].length + 1}>${inline(h[2])}</h${h[1].length + 1}>`; continue; }
    if (/^(---+|\*\*\*+)$/.test(t)) { flushPara(); flushList(); html += "<hr>"; continue; }
    if (/^&gt;\s?/.test(t)) { flushPara(); flushList(); html += `<blockquote>${inline(t.replace(/^&gt;\s?/, ""))}</blockquote>`; continue; }
    const ul = /^[-*]\s+(.*)$/.exec(t);
    if (ul) { flushPara(); if (!list || list.tag !== "ul") { flushList(); list = { tag: "ul", items: [] }; } list.items.push(ul[1]); continue; }
    const ol = /^\d+[.)]\s+(.*)$/.exec(t);
    if (ol) { flushPara(); if (!list || list.tag !== "ol") { flushList(); list = { tag: "ol", items: [] }; } list.items.push(ol[1]); continue; }
    flushList();
    para.push(line);
  }
  flushPara(); flushList();
  return html.replace(/\u0000(\d+)\u0000/g, (_, i) => {
    const b = blocks[Number(i)];
    return `<div class="codeblock"><div class="cbhead"><span>${esc(b.lang)}</span><button class="cbcopy" data-i="${i}">copy</button></div><pre>${esc(b.code)}</pre></div>`;
  });
}

/* ── the chat thread ───────────────────────────────────────────────────── */
const col = $("#col");
const examples = [
  ["✦", "Explain something", "In two sentences: why is a local router with a judge cheaper than pointing everything at one big model?"],
  ["✦", "Think hard", "I have 45 minutes and want to understand how DNS resolution works, top to bottom. Give me the good version."],
  ["⌘", "Start a workflow", "/run — pick from the registered library and watch it live"],
];

function greeting() {
  const h = new Date().getHours();
  return h < 5 ? "Up late." : h < 12 ? "Good morning." : h < 18 ? "Good afternoon." : "Good evening.";
}

function welcome() {
  const d = document.createElement("div");
  d.className = "welcome";

    <h2>${esc(greeting())}</h2>

    <div class="ex"></div>
    <p class="hintline"><kbd>⏎</kbd> send &nbsp;·&nbsp; <span class="mono">/run</span> starts a workflow &nbsp;·&nbsp; <span class="mono">/remember ·</span> <span class="mono">/recall</span> durable memory &nbsp;·&nbsp; answers to agents appear in the rail</p>`;
  const ex = d.querySelector(".ex");

    b.innerHTML = `<span class="g">${g}</span><span><b>${esc(t)}</b><br><span class="d">${esc(q === "/run — pick from the registered library and watch it live" ? "pick from the registered library and watch it live" : q)}</span></span>`;
    b.onclick = () => { $("#say").value = t === "Start a workflow" ? "/run " : q; $("#say").focus(); if (t !== "Start a workflow") send(); };
    ex.appendChild(b);
  }

function userMsg(text) {
  const w = col.querySelector(".welcome");
  if (w) w.remove();
  const d = document.createElement("div");
  d.className = "m m-user";
  d.innerHTML = `<div class="bubble"></div>`;
  d.querySelector(".bubble").textContent = text;
  col.appendChild(d);
  scrollDown();
  return d;
}

function botMsg() {
  const d = document.createElement("div");
  d.className = "m m-bot";
  d.innerHTML = `<div class="who">auto</div><div class="body"></div>`;
  col.appendChild(d);
  scrollDown();
  return d;
}
function scrollDown() {
  const t = $("#thread");
  t.scrollTop = t.scrollHeight;
}

const fmtDur = (ms) => ms < 1000 ? `${Math.round(ms)}ms` : `${(ms / 1000).toFixed(1)}s`;
function verdictBar(node, headers, ms, usage) {
  const bits = [];
  const wl = headers?.get("x-router-workload");
  const ex = headers?.get("x-router-execution");
  if (wl) bits.push(wl);
  if (ex) bits.push(ex);
  if (headers?.get("x-router-workflow")) bits.push(`workflow ${headers.get("x-router-workflow")}`);
  if (usage) bits.push(`${usage} tok`);
  if (Number.isFinite(ms)) bits.push(fmtDur(ms));
  if (!bits.length) return;
  const v = document.createElement("div");
  v.className = "verdict";
  v.innerHTML = `<span class="tick"></span><span>${bits.map((b) => esc(b)).join(" · ")}</span>`;
  node.querySelector(".body").after(v);
}

let streaming = false;
const threadLog = [];
function buildMessages(text) {
  const m = threadLog.slice(-20).map((x) => ({ role: x.role, content: x.content }));
  m.push({ role: "user", content: text });
  return m;
}

async function send() {
  const input = $("#say");
  const text = input.value.trim();
  if (!text || streaming) return;
  input.value = "";
  if (text.startsWith("/run")) return startRun(text.slice(4).trim());
  if (text.startsWith("/remember ")) return remember(text.slice(10).trim());
  if (text.startsWith("/recall")) return recall(text.slice(7).trim());
  userMsg(text);
  streaming = true;
  $("#send").disabled = true;
  const node = botMsg();
  const body = node.querySelector(".body");
  const textNode = document.createTextNode("");
  body.appendChild(textNode);
  const caret = document.createElement("span");
  caret.className = "caret";
  body.appendChild(caret);
  let got = "";
  const t0 = performance.now();
  try {
    const res = await fetch("/v1/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
      body: JSON.stringify({ model: "auto", stream: true, messages: buildMessages(text) }),
    });
    if (!res.ok) {
      const b = await res.json().catch(() => ({}));
      throw new Error(b.error?.message ?? `HTTP ${res.status}`);
    }
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "", usage = null;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split("\n");
      buf = lines.pop() ?? "";
      for (const line of lines) {
        const s = line.trim();
        if (!s.startsWith("data:")) continue;
        const payload = s.slice(5).trim();
        if (payload === "[DONE]") continue;
        try {
          const j = JSON.parse(payload);
          const piece = j.choices?.[0]?.delta?.content ?? "";
          if (j.usage?.total_tokens) usage = j.usage.total_tokens;
          if (piece) {
            got += piece;
            textNode.data = got;
            scrollDown();
          }
        } catch {}
      }
    }
    caret.remove();
    const ms = performance.now() - t0;
    if (!got) textNode.data = "(empty response)";
    // Replies read as prose, not as raw wire text: markdown, escape-first.
    body.innerHTML = renderMarkdown(got);
    verdictBar(node, res.headers, ms, usage);
    $("#routePill").textContent = `routed · ${res.headers.get("x-router-workload") ?? "auto"}`;
    threadLog.push({ role: "user", content: text }, { role: "assistant", content: got });
  } catch (e) {
    caret.remove();
    node.classList.add("err");
    body.textContent = e.message === "unauthorized" ? "Locked — check the token." : `The router could not answer: ${e.message}`;
    threadLog.push({ role: "user", content: text }, { role: "assistant", content: got || `(${e.message})` });
  }
  streaming = false;
  $("#send").disabled = false;
  $("#say").focus();
}
$("#send").onclick = send;
$("#say").addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
col.addEventListener("click", (e) => {
  const b = e.target.closest(".cbcopy");
  if (b) {
    navigator.clipboard?.writeText(b.closest(".codeblock").querySelector("pre").textContent);
    b.textContent = "copied";
    setTimeout(() => { b.textContent = "copy"; }, 1200);
  }
});

/* ── runs, started from the same input box ─────────────────────────────── */
const runCards = new Map(); // runId -> {card, revs, stat, dot}
async function startRun(name) {
  let workflows = (state?.resolved?.workflows ?? []).map((w) => w?.name).filter(Boolean);
  if (!workflows.length) { botErr("No workflows are registered — the judge routes into whatever the roster registered."); return; }
  if (!name || !workflows.includes(name)) {
    botNote(`Which workflow? Available: ${workflows.map((w) => `/${w}`).join("  ")}\nType /run <name> to start one.`);
    return;
  }
  try {
    // Five minutes of owner wait: an escalation holds the run open and the
    // question shows up in the rail, answerable right there.
    const r = await api("/v1/runs", { method: "POST", body: JSON.stringify({ workflow: name, awaitOwnerMs: 300000 }) });
    userMsg(`/run ${name}`);
    const card = runCard(r.runId, name, "you");
    col.appendChild(card.card);
    scrollDown();
  } catch (e) {
    botErr(`Could not start ${name}: ${e.message}`);
  }
}
function botNote(text) { const n = botMsg(); n.querySelector(".body").innerHTML = renderMarkdown(text); }

/* ── the durable memory plane, from the same input box ────────────────── */
async function remember(text) {
  if (!text) { botErr("Remember what? `/remember <the fact>` — it goes into the kit's durable store."); return; }
  userMsg(`/remember ${text}`);
  try {
    const r = await api("/api/memory", { method: "POST", body: JSON.stringify({ entities: [{ name: text.slice(0, 56), entityType: "memory", observations: [text, `remembered: ${new Date().toISOString().slice(0, 10)}`], importance: 0.7, veracity: "stated" }] }) });
    botNote(`Remembered. The store now holds ${r.added?.length ? "a new memory" : "an updated memory"}. ${r.added?.length ? "" : "(a memory with that name already existed — use /recall to read it)"}`);
  } catch (e) { botErr(`Could not remember: ${e.message}`); }
}
async function recall(q) {
  userMsg(q ? `/recall ${q}` : "/recall");
  try {
    if (!q) {
      const s = await api("/api/memory");
      botNote(`The store holds **${s.stats.entities} memories** across ${s.stats.relations} relations. Ask: \`/recall <what>\``);
      return;
    }
    const r = await api(`/api/memory?q=${encodeURIComponent(q)}`);
    if (!(r.entities ?? []).length) { botNote(`Nothing remembered for **${q}** yet.`); return; }
    const lines = r.entities.slice(0, 5).map((e) => `- **${e.name.replace(/ [#\[].*$/, "")}** — ${(e.observations[0] ?? "").slice(0, 160)} · <span class="mono">${esc(e.veracity ?? "unknown")}${e.score != null ? ` · ${e.score}` : ""}</span>`);
    botNote(`Remembered, best match first:\n${lines.join("\n")}`);
  } catch (e) { botErr(`Could not recall: ${e.message}`); }
}
function botErr(text) { const n = botMsg(); n.classList.add("err"); n.querySelector(".body").textContent = text; }

function runCard(runId, wf, who) {
  const card = document.createElement("div");
  card.className = "runcard";
  card.innerHTML = `
    <div class="rhead"><span class="dot"></span> ${esc(wf)} <span class="rid">${esc(runId)}</span>
      <span class="rwho">spawned by ${esc(who)}</span></div>
    <div class="revs"></div>
    <div class="rstat"><span class="rstat-t">running</span></div>`;
  const rec = { card, revs: card.querySelector(".revs"), dot: card.querySelector(".dot"), stat: card.querySelector(".rstat-t") };
  runCards.set(runId, rec);
  return rec;
}
function runEventLine(ev) {
  switch (ev.kind) {
    case "phase": return `▸ ${ev.phase}`;
    case "agent": return `◦ agent ${ev.actor}`;
    case "tool": return `  · ${ev.actor}:${ev.tool}${ev.refused ? ` REFUSED (${ev.refused})` : ""}`;
    case "report": return `  ✓ ${ev.item ?? ""}`;
    case "escalation": return ev.op === "resolved" ? `  ↩ answered (${ev.source ?? "owner"})` : `  ⚠ waiting on you: ${ev.question ?? ""}`;
    case "run-done": return `✔ done in ${ev.ms ?? "?"}ms`;
    case "run-failed": return `✗ failed: ${ev.error ?? ""}`;
    default: return null;
  }
}
function feedRunCard(runId, ev) {
  const rec = runCards.get(runId);
  const line = runEventLine(ev);
  if (rec && line) {
    const d = document.createElement("div");
    d.className = `g-${ev.kind.slice(0, 4)}`;
    d.textContent = line;
    rec.revs.appendChild(d);
    rec.revs.scrollTop = rec.revs.scrollHeight;
  }
  if (ev.kind === "run-done") finishCard(runId, "ok", `done · ${ev.ms ?? "?"}ms`);
  if (ev.kind === "run-failed") finishCard(runId, "bad", "failed");
}
function finishCard(runId, cls, label) {
  const rec = runCards.get(runId);
  if (!rec) return;
  rec.dot.className = `dot ${cls}`;
  rec.stat.textContent = label;
}

/* ── the agents rail ───────────────────────────────────────────────────── */
const agoStr = (ms) => ms == null ? "no runs yet"
  : ms < 60_000 ? `${Math.max(1, Math.floor(ms / 1000))}s ago`
  : ms < 3_600_000 ? `${Math.floor(ms / 60_000)}m ago`
  : `${Math.floor(ms / 3_600_000)}h ago`;
// A stable hue per agent name: the fleet reads as identities, not rows.
const hueOf = (name) => {
  let h = 0;
  for (const c of String(name)) h = (h * 31 + c.charCodeAt(0)) % 360;
  return h;
};

async function refreshAgents() {
  let data;
  try { data = await api("/api/agents"); } catch (e) { if (e.message !== "unauthorized") return; }
  const att = $("#attention");
  att.innerHTML = "";
  for (const a of data.attention ?? []) {
    const d = document.createElement("div");
    d.className = "atten";
    d.innerHTML = `
      <div class="who">${esc(a.app)} needs you</div>
      <div class="q">${esc(a.question ?? "")}</div>
      ${a.evidence ? `<div class="ev">${esc(a.evidence)}</div>` : ""}
      <input type="text" placeholder="answer — or just approve" autocomplete="off">
      <div class="row"><button class="primary">Approve</button><button>Skip</button></div>`;
    const inp = d.querySelector("input");
    const answer = async (text) => {
      try {
        await api(`/v1/runs/${encodeURIComponent(a.runId)}/answers`, {
          method: "POST",
          body: JSON.stringify({ topic: a.topic ?? "", answer: text }),
        });
        d.innerHTML = `<div class="answered">✓ answered — the run resumes</div>`;
        setTimeout(refreshAgents, 1500);
      } catch (e) {
        if (e.message !== "unauthorized") { inp.value = ""; inp.placeholder = `failed: ${e.message}`; }
      }
    };
    d.querySelector(".primary").onclick = () => answer(inp.value.trim() || "yes");
    d.querySelector(".row button:not(.primary)").onclick = () => answer("skip");
    inp.addEventListener("keydown", (e) => { if (e.key === "Enter") answer(inp.value.trim() || "yes"); });
    att.appendChild(d);
  }
  const wrap = $("#agents");
  wrap.innerHTML = "";
  const agents = data.agents ?? [];
  $("#agentCount").textContent = agents.length ? String(agents.length) : "";
  for (const ag of agents) {
    const d = document.createElement("div");
    d.className = "agent";
    const hue = hueOf(ag.name);
    const live = ag.liveRuns > 0;
    const grants = ag.grants?.length ? ag.grants.join(" · ") : null;
    d.innerHTML = `
      <div class="ahead">
        <span class="adot ${live ? "live" : ""}" style="background:hsl(${hue} 70% 60%);color:hsl(${hue} 70% 60%)"></span>
        <span class="aname">${esc(ag.name)}</span>
        <span class="ameta">${live ? `${ag.liveRuns} live` : ag.lastActivityMs == null ? "never ran" : "idle"}<br>${ag.lastActivityMs == null ? "&nbsp;" : esc(agoStr(ag.lastActivityMs))}</span>
      </div>`;
    const head = d.querySelector(".ahead");
    head.title = ag.kind === "operator" ? "you — the operator token" : grants ? `ceiling: ${grants}` : "connected app";
    const runs = ag.runs ?? [];
    if (runs.length) {
      const body = document.createElement("div");
      body.className = "aruns hidden";
      for (const r of runs.slice(0, 8)) {
        const rr = document.createElement("div");
        rr.className = "arun";
        rr.innerHTML = `
          <div class="awf">${esc(r.workflow ?? "")}${r.pending ? `<span class="st">waiting on you</span>` : ""}</div>
          <div class="ast">${esc(agoStr(r.lastEventAgeMs))} · ${r.events} events</div>
          <div class="aevs"></div>`;
        rr.onclick = async () => {
          rr.classList.toggle("open");
          const box = rr.querySelector(".aevs");
          if (!rr.classList.contains("open") || box.childElementCount) return;
          try {
            const full = await api(`/api/workflow-run/${encodeURIComponent(r.runId)}`);
            box.innerHTML = "";
            for (const ev of (full.events ?? []).slice(-30)) {
              const line = runEventLine(ev);
              if (line) { const x = document.createElement("div"); x.className = `g-${ev.kind.slice(0, 4)}`; x.textContent = line; box.appendChild(x); }
            }
          } catch {}
        };
        body.appendChild(rr);
      }
      d.appendChild(body);
      head.onclick = () => body.classList.toggle("hidden");
    } else {
      const note = document.createElement("div");
      note.className = "empty";
      note.style.padding = "0 12px 9px";
      note.textContent = ag.kind === "operator" ? "your runs will appear here" : "no runs yet from this agent";
      d.appendChild(note);
    }
    wrap.appendChild(d);
  }
}

/* ── live wire ─────────────────────────────────────────────────────────── */
let es = null;
function startSse() {
  es?.close();
  es = new EventSource(`/api/workflow-events?token=${encodeURIComponent(token)}`);
  es.onmessage = (m) => {
    let msg;
    try { msg = JSON.parse(m.data); } catch { return; }
    if (msg.type === "event" && msg.runId) {
      feedRunCard(msg.runId, msg.event ?? {});
      if (msg.event?.kind === "run-start") railDirty = true;
    }
    if (msg.type === "summary" && msg.summary) feedRunCard(msg.runId, { kind: msg.summary.ok === false ? "run-failed" : "run-done", ms: msg.summary.durationMs });
  };
}
let railDirty = false;
setInterval(() => { if (railDirty) { railDirty = false; refreshAgents(); } }, 4000);
setInterval(refreshAgents, 5000);
